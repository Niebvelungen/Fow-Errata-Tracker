<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Force of Will — Errata Report</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { font: 15px/1.5 system-ui, sans-serif; margin: 0; background: #f4f4f6; color: #1a1a1a; }
@media (prefers-color-scheme: dark){ body{ background:#15161a; color:#e6e6e6; } }
header.top { padding: 24px 32px; background: #2a2d3a; color: #fff; }
header.top h1 { margin: 0 0 4px; font-size: 22px; }
header.top .sub { opacity: .8; font-size: 14px; }
.toolbar { padding: 10px 32px; position: sticky; top: 0; background: inherit; z-index: 5;
  border-bottom: 1px solid #ccc3; backdrop-filter: blur(6px); display: flex; gap: 18px;
  flex-wrap: wrap; align-items: center; }
.toolbar .group { display: flex; gap: 6px; align-items: center; }
.toolbar .label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; opacity: .55; }
.toolbar button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 16px;
  border: 1px solid #8884; background: #fff2; cursor: pointer; }
.toolbar button.active { background: #4860ff; color: #fff; border-color: #4860ff; }
.toolbar .spacer { flex: 1; }
.toolbar .export { background: #1f9d55; color: #fff; border-color: #1f9d55; font-weight: 600; }
.toolbar .export.blk { background: #6b7280; border-color: #6b7280; }
.toolbar .counts { font-size: 13px; opacity: .75; }
.layout { display: flex; align-items: flex-start; }
nav.sets { position: sticky; top: 52px; flex: 0 0 220px; width: 220px;
  max-height: calc(100vh - 56px); overflow-y: auto; padding: 14px 10px 40px; }
nav.sets .label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
  opacity: .55; padding: 4px 10px 8px; }
nav.sets button { display: flex; justify-content: space-between; gap: 8px; align-items: baseline;
  width: 100%; text-align: left; font: inherit; font-size: 13px; padding: 6px 10px; margin: 2px 0;
  border: 1px solid transparent; border-radius: 8px; background: transparent; cursor: pointer;
  color: inherit; }
nav.sets button:hover { background: #00000010; }
@media (prefers-color-scheme: dark){ nav.sets button:hover{ background:#ffffff14; } }
nav.sets button.active { background: #4860ff; color: #fff; }
nav.sets .code { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav.sets .n { opacity: .65; font-variant-numeric: tabular-nums; flex: none; }
nav.sets button.active .n { opacity: .9; }
main { flex: 1; min-width: 0; padding: 20px 32px 80px; }
.card { background: #fff; border-radius: 12px; margin: 18px 0; padding: 16px 20px;
  box-shadow: 0 1px 4px #0001; border-left: 5px solid transparent;
  content-visibility: auto; contain-intrinsic-size: auto 520px; }
@media (prefers-color-scheme: dark){ .card{ background:#1f2026; box-shadow:none; border:1px solid #ffffff14; border-left:5px solid transparent; } }
.card[data-decision] { border-left-color: #4860ff; }
.card.decided-errata { border-left-color: #e0483a; }
.card.decided-format_change { border-left-color: #e0a33a; }
.card.decided-no_change { border-left-color: #9aa0aa; opacity: .6; }
.card header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.card h2 { font-size: 18px; margin: 0; }
.badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 12px; text-transform: uppercase; letter-spacing: .04em; }
.badge.src { background: #e0e7ff; color: #3340b0; }
.badge.src-ocr { background: #ffe7d1; color: #a4520a; }
.badge.src-web { background: #d6f0e0; color: #1a6b43; }
.badge.src-article { background: #e6dcff; color: #5534a8; }
.badge.src-physical { background: #d8eef7; color: #14607f; }
.badge.chg { background: #fde7c0; color: #8a5200; }
.attrs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.attr { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: #00000008; }
@media (prefers-color-scheme: dark){ .attr{ background:#ffffff10; } }
.attr.chg { background: #fde7c0; color: #8a5200; font-weight: 600; }
/* Inside a chip the bubble itself says what happened, so the words stay plain
   and readable instead of green-on-amber. */
.attr.add { background: #c9f0d0; color: #10251a; font-weight: 600; }
.attr.del { background: #ffd7d5; color: #2d1211; font-weight: 600; }
.attrs del, .attrs ins { background: none; color: inherit; }
.attrs ins { text-decoration: none; }
@media (prefers-color-scheme: dark){
  .attr.add{ background:#1d5e3066; color:#dff5e5; }
  .attr.del{ background:#75232866; color:#ffe0dd; }
}
/* Columns share one grid so meta / image / text / attrs line up row by row —
   a side without an image must not push its text out of line with the other. */
.cols { display: grid; grid-template-columns: 1fr 1fr;
  grid-template-rows: auto auto auto auto; column-gap: 20px; }
.cols3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
.cols > section { display: contents; }
.cols > section:nth-of-type(1) > * { grid-column: 1; }
.cols > section:nth-of-type(2) > * { grid-column: 2; }
.cols .meta { grid-row: 1; }
.cols .media { grid-row: 2; }
.cols .text { grid-row: 3; }
.cols .attrs { grid-row: 4; }
@media (max-width: 720px){
  .cols, .cols3 { grid-template-columns: 1fr; }
  /* Stacked: plain block sections again, so the shared rows don't collide. */
  .cols > section { display: block; margin-bottom: 20px; }
}
@media (min-width: 721px) and (max-width: 1000px){ .cols3 { grid-template-columns: 1fr 1fr; } }
.meta { font-size: 12px; opacity: .7; margin-bottom: 8px; }
.card img { width: 100%; max-width: 260px; border-radius: 8px; display: block; margin-bottom: 10px; }
.noimg { font-size: 12px; opacity: .5; padding: 8px 0; }
.text { background: #fafafa; border: 1px solid #0000000d; border-radius: 8px; padding: 10px 12px;
  margin: 0; white-space: pre-wrap; }
@media (prefers-color-scheme: dark){ .text{ background:#0000001f; border-color:#ffffff14; } }
.extra { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; opacity: .8; }
.extra a { color: inherit; }
.note { margin: 0; font-style: italic; }
del { background: #ffd7d5; color: #86181d; text-decoration: line-through; }
ins { background: #c9f0d0; color: #11662b; text-decoration: none; }
@media (prefers-color-scheme: dark){ del{ background:#75232855; color:#ffb3ad; } ins{ background:#1d5e3055; color:#9be8ad; } }
.review { display: flex; gap: 8px; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid #0000000f; }
@media (prefers-color-scheme: dark){ .review{ border-top-color:#ffffff14; } }
.review .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #c9ccd2; }
.card[data-decision] .status-dot { background: #4860ff; }
.card.decided-errata .status-dot { background: #e0483a; }
.card.decided-format_change .status-dot { background: #e0a33a; }
.card.decided-no_change .status-dot { background: #9aa0aa; }
.review .rev { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 8px;
  border: 1px solid #8884; background: #fff2; cursor: pointer; }
.review .rev.clear { opacity: .6; }
.review .rev.sel { background: #4860ff; color: #fff; border-color: #4860ff; }
.card.decided-errata .rev.errata { background: #e0483a; color: #fff; border-color: #e0483a; }
.card.decided-format_change .rev.format_change { background: #e0a33a; color: #fff; border-color: #e0a33a; }
.card.decided-no_change .rev.no_change { background: #6b7280; color: #fff; border-color: #6b7280; }
.status { padding: 40px 4px; font-size: 15px; opacity: .75; }
.status.error { opacity: 1; background: #fde7c0; color: #8a5200; border-radius: 12px; padding: 16px 20px; }
.status.error code { font-size: 12px; word-break: break-all; }
</style></head>
<body>
<header class="top">
  <h1>Force of Will — Errata Report</h1>
  <div class="sub" id="subtitle">Loading…</div>
</header>
<div class="toolbar">
  <div class="group" data-group="source">
    <span class="label">Source</span>
  </div>
  <div class="group" data-group="status">
    <span class="label">Review</span>
  </div>
  <div class="spacer"></div>
  <span class="counts" id="counts"></span>
  <button id="reset" title="Discard the decisions changed in this browser and fall back to the ones stored in the data file">↺ Reset session</button>
  <button class="export" id="export">⬇ Export data</button>
  <button class="export blk" id="export-blacklist">⬇ blacklist.json</button>
</div>
<div class="layout">
  <nav class="sets">
      <div class="label">Sets</div>
  </nav>
  <main><div class="status" id="boot">Loading errata data…</div></main>
</div>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------- data source
// Everything on this page is rendered from the JSON below — nothing is baked in.
// Served from GitHub Pages, the relative path wins; opened straight from disk it
// falls back to the hosted copy (file:// cannot fetch its neighbours).
const REMOTE_BASE = 'https://niebvelungen.github.io/Fow-Errata-Tracker/';
const params = new URLSearchParams(location.search);
const DATA_URLS = [
  params.get('data'),
  '../default/errata-data-v2.json',
  REMOTE_BASE + 'default/errata-data-v2.json',
].filter(Boolean);

const STORE = 'fow-errata-decisions-v2';
const UNREVIEWED = 'unreviewed';
// Decisions the review bar always offers; the data file may add more.
const BASE_DECISIONS = ['errata', 'format_change', 'no_change'];
const DECISION_ICON = { errata: '⚑', format_change: '≈', no_change: '∅' };
const SOURCE_LABEL = { ocr: 'OCR', web: 'Web' };

// --------------------------------------------------------------------- helpers
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#x27;');

// "format_change" -> "Format change"; used for anything the data file invents.
const pretty = s => {
  const t = String(s || '').replace(/[_-]+/g, ' ').trim();
  return t ? t[0].toUpperCase() + t.slice(1) : '';
};
const sourceLabel = s => SOURCE_LABEL[s] || pretty(s);
const decisionLabel = d => pretty(d);

const fetchFirst = async urls => {
  const errors = [];
  for (const url of urls) {
    try {
      const res = await fetch(url, { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return { url, json: await res.json() };
    } catch (err) {
      errors.push(url + ' — ' + err.message);
    }
  }
  const e = new Error('could not load data');
  e.tried = errors;
  throw e;
};

// ---------------------------------------------------------------- render cards
const imgTag = url => url
  ? `<a href="${esc(url)}" target="_blank" rel="noopener">` +
    `<img loading="lazy" src="${esc(url)}" alt=""></a>`
  : '';

// Which way a side's diff went — the chip is tinted instead of the words.
// Empty-valued ops don't count: a blank race reads as "none", not "removed".
const diffDirection = (ops, html) => {
  const kinds = new Set((ops || [])
    .filter(o => o && String(o.value || '').trim())
    .map(o => o.op));
  if (kinds.has('insert') || (!ops && /<ins>\s*\S/.test(html || ''))) return ' add';
  if (kinds.has('delete') || (!ops && /<del>\s*\S/.test(html || ''))) return ' del';
  return '';
};

// Cost/race line under a column — only when the side actually carries them.
const attrs = (side, entry) => {
  const bits = [];
  if (side.cost != null && side.cost !== '') {
    bits.push(`<span class="attr${entry.cost_changed ? ' chg' : ''}">Cost: ${esc(side.cost)}</span>`);
  }
  if (side.race != null) {
    const races = (Array.isArray(side.race) ? side.race : [side.race])
      .map(r => String(r == null ? '' : r).trim()).filter(Boolean);
    // race_html carries the marked-up diff; fall back to the plain values.
    const shown = races.length ? (side.race_html || esc(races.join(', '))) : '—';
    const cls = entry.race_changed
      ? (diffDirection(side.race_diff, side.race_html) || ' chg')
      : '';
    bits.push(`<span class="attr${cls}">Race: ${shown}</span>`);
  }
  return bits.length ? `<div class="attrs">${bits.join('')}</div>` : '';
};

const panel = (side, entry, link) => {
  const where = [side.card_id, side.set_code && side.set_name
    ? side.set_code + ' — ' + side.set_name
    : (side.set_name || side.set_code)].filter(Boolean).map(esc);
  const head = [esc(side.label) || 'Text', ...where].join(' · ');
  const meta = link
    ? `${head} · <a href="${esc(link)}" target="_blank" rel="noopener">source</a>`
    : head;
  // The .media slot is always emitted, even when empty, so both columns keep
  // their text on the same row when only one side has an image.
  return `<section><div class="meta">${meta}</div><div class="media">${imgTag(side.image)}</div>` +
    `<p class="text">${side.text_html || esc(side.text) || '<em>(no text)</em>'}</p>` +
    `${attrs(side, entry)}</section>`;
};

const extras = entry => {
  const rows = [];
  const art = entry.errata_article;
  if (art && art.url) {
    const bits = [esc(art.title) || 'Errata article', esc(art.date)].filter(Boolean).join(' · ');
    rows.push(`<div>📄 <a href="${esc(art.url)}" target="_blank" rel="noopener">${bits}</a></div>`);
  }
  if (entry.supersedes) rows.push(`<div>Supersedes ${esc(entry.supersedes)}</div>`);
  if (entry.notes && entry.notes.trim()) rows.push(`<p class="note">${esc(entry.notes)}</p>`);
  return rows.length ? `<div class="extra">${rows.join('')}</div>` : '';
};

const reviewBar = key => {
  const buttons = DECISIONS.map(d =>
    `<button class="rev ${esc(d)}" data-decision="${esc(d)}">` +
    `${DECISION_ICON[d] ? DECISION_ICON[d] + ' ' : ''}${esc(decisionLabel(d))}</button>`).join('');
  return `<footer class="review" data-key="${esc(key)}"><span class="status-dot"></span>` +
    `${buttons}<button class="rev clear" data-decision="">Clear</button></footer>`;
};

const cardHtml = entry => {
  const chips = (entry.changed || [])
    .map(c => `<span class="badge chg">${esc(c)}</span>`).join('');
  const src = esc(entry.source);
  return `<article class="card" data-key="${esc(entry.key)}" data-set="${esc(entry.set_code)}" data-source="${src}">
      <header><h2>${esc(entry.card_name)}</h2>
        <span class="badge src src-${src}">${esc(sourceLabel(entry.source))}</span>${chips}</header>
      <div class="cols">
        ${panel(entry.old || {}, entry, null)}
        ${panel(entry.new || {}, entry, entry.source_url)}
      </div>
      ${extras(entry)}
      ${reviewBar(entry.key)}
    </article>`;
};

// ------------------------------------------------------------------ page state
let RAW = null;            // the loaded file, verbatim (kept for re-export)
let ENTRIES = [];
let DECISIONS = [];        // decision vocabulary offered by the review bar
let base = {};             // decisions as stored in the data file
let overrides = {};        // decisions changed in this browser session
let decisions = {};        // base + overrides, what the page shows
let filterSource = 'all', filterStatus = 'all', filterSet = 'all';

const loadOverrides = () => {
  try { return JSON.parse(localStorage.getItem(STORE) || '{}'); } catch { return {}; }
};
const saveOverrides = () => localStorage.setItem(STORE, JSON.stringify(overrides));
const mergeDecisions = () => {
  decisions = Object.assign({}, base);
  for (const [k, v] of Object.entries(overrides)) {
    if (v && v !== UNREVIEWED) decisions[k] = v; else delete decisions[k];
  }
};

const applyCard = article => {
  const d = decisions[article.dataset.key];
  DECISIONS.forEach(x => article.classList.remove('decided-' + x));
  if (d) {
    article.dataset.decision = d;
    article.classList.add('decided-' + d);
  } else {
    delete article.dataset.decision;
  }
  article.querySelectorAll('.rev').forEach(b =>
    b.classList.toggle('sel', !!d && b.dataset.decision === d));
};

const statusOf = article => decisions[article.dataset.key] || UNREVIEWED;

// Changing a filter re-lists from the top; keeping the old scroll offset lands
// you in the middle of a different set of cards.
const applyFilter = (resetScroll) => {
  if (resetScroll) window.scrollTo(0, 0);
  document.querySelectorAll('.card').forEach(c => {
    const okSrc = filterSource === 'all' || c.dataset.source === filterSource;
    const okSt = filterStatus === 'all' || statusOf(c) === filterStatus;
    const okSet = filterSet === 'all' || c.dataset.set === filterSet;
    c.style.display = (okSrc && okSt && okSet) ? '' : 'none';
  });
};

const tally = () => {
  const counts = {};
  DECISIONS.forEach(d => counts[d] = 0);
  ENTRIES.forEach(e => {
    const d = decisions[e.key];
    if (d in counts) counts[d]++;
  });
  return counts;
};

const updateCounts = () => {
  const counts = tally();
  const reviewed = DECISIONS.reduce((n, d) => n + counts[d], 0);
  const parts = DECISIONS.map(d => `${counts[d]} ${decisionLabel(d).toLowerCase()}`);
  parts.push(`${ENTRIES.length - reviewed} unreviewed of ${ENTRIES.length}`);
  document.getElementById('counts').textContent = parts.join(' · ');
};

const download = (name, obj) => {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
};

// ------------------------------------------------------------------- chrome UI
const filterButtons = (group, options) => {
  group.querySelectorAll('button').forEach(b => b.remove());
  options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.dataset.filter = opt.value;
    b.textContent = opt.label;
    if (i === 0) b.classList.add('active');
    b.onclick = () => {
      group.querySelectorAll('button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      if (group.dataset.group === 'source') filterSource = opt.value;
      else filterStatus = opt.value;
      applyFilter(true);
    };
    group.appendChild(b);
  });
};

const buildChrome = () => {
  // Source tabs, in the order the sources first appear in the data.
  const srcOrder = [], srcCount = {};
  ENTRIES.forEach(e => {
    if (!(e.source in srcCount)) { srcOrder.push(e.source); srcCount[e.source] = 0; }
    srcCount[e.source]++;
  });
  filterButtons(document.querySelector('.group[data-group="source"]'), [
    { value: 'all', label: `All (${ENTRIES.length})` },
    ...srcOrder.map(s => ({ value: s, label: `${sourceLabel(s)} (${srcCount[s]})` })),
  ]);

  filterButtons(document.querySelector('.group[data-group="status"]'), [
    { value: 'all', label: 'All' },
    ...DECISIONS.map(d => ({ value: d, label: decisionLabel(d) })),
    { value: UNREVIEWED, label: 'Unreviewed' },
  ]);

  // Sidebar: one tab per set present, in data order, with its full name.
  const setOrder = [], setCount = {}, setName = {};
  ENTRIES.forEach(e => {
    const code = e.set_code || '';
    if (!(code in setCount)) {
      setOrder.push(code);
      setCount[code] = 0;
      setName[code] = (e.new && e.new.set_name) || (e.old && e.old.set_name) || '';
    }
    setCount[code]++;
  });
  const nav = document.querySelector('nav.sets');
  nav.querySelectorAll('button').forEach(b => b.remove());
  const navItems = [{ code: 'all', label: 'All', title: '', n: ENTRIES.length }].concat(
    setOrder.map(c => ({ code: c, label: c || '—', title: setName[c], n: setCount[c] })));
  navItems.forEach((item, i) => {
    const b = document.createElement('button');
    b.dataset.set = item.code;
    b.title = item.title;
    b.innerHTML = `<span class="code">${esc(item.label)}</span><span class="n">${item.n}</span>`;
    if (i === 0) b.classList.add('active');
    b.onclick = () => {
      nav.querySelectorAll('button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      filterSet = item.code;
      applyFilter(true);
    };
    nav.appendChild(b);
  });

  const srcParts = srcOrder.map(s => `${srcCount[s]} ${sourceLabel(s).toLowerCase()}`);
  document.getElementById('subtitle').innerHTML =
    `${ENTRIES.length} candidates · ${srcParts.map(esc).join(' · ')} · ` +
    `<del>deletions</del> / <ins>additions</ins> highlighted · decisions saved in your browser`;
};

// --------------------------------------------------------------------- exports
const exportData = () => {
  const entries = ENTRIES.map(e => Object.assign({}, e, { decision: decisions[e.key] || UNREVIEWED }));
  const counts = {};
  entries.forEach(e => counts[e.decision] = (counts[e.decision] || 0) + 1);
  // Same envelope as the file we read, so an export can be committed back.
  download('errata-data-v2.json', Object.assign({}, RAW, {
    count: entries.length,
    counts_by_decision: counts,
    entries,
  }));
};

const exportBlacklist = () => {
  const keys = ENTRIES.map(e => e.key).filter(k => decisions[k] === 'no_change');
  download('blacklist.json', { keys });
};

// ------------------------------------------------------------------------ boot
const render = () => {
  const main = document.querySelector('main');
  main.innerHTML = ENTRIES.map(cardHtml).join('') || '<div class="status">No errata in this file.</div>';
  main.querySelectorAll('.review').forEach(bar => {
    const article = bar.closest('.card');
    bar.querySelectorAll('.rev').forEach(btn => {
      btn.onclick = () => {
        const key = bar.dataset.key;
        const dec = btn.dataset.decision;
        // Only the delta against the file is kept, so the file stays authoritative.
        if ((base[key] || '') === dec) delete overrides[key];
        else overrides[key] = dec || UNREVIEWED;
        saveOverrides();
        mergeDecisions();
        applyCard(article);
        updateCounts();
        applyFilter();
      };
    });
  });
  document.querySelectorAll('.card').forEach(applyCard);
};

const start = data => {
  RAW = data;
  ENTRIES = Array.isArray(data) ? data : (data.entries || []);
  base = {};
  ENTRIES.forEach(e => {
    if (e.decision && e.decision !== UNREVIEWED) base[e.key] = e.decision;
  });
  // Vocabulary = the decisions this page always offers + anything the file uses.
  DECISIONS = BASE_DECISIONS.concat(
    [...new Set(Object.values(base))].filter(d => !BASE_DECISIONS.includes(d)));
  overrides = loadOverrides();
  mergeDecisions();
  buildChrome();
  render();
  updateCounts();
  applyFilter();
};

document.getElementById('export').onclick = exportData;
document.getElementById('export-blacklist').onclick = exportBlacklist;
document.getElementById('reset').onclick = () => {
  if (!Object.keys(overrides).length) return;
  if (!confirm('Discard the ' + Object.keys(overrides).length +
    ' decision(s) changed in this browser and go back to the data file?')) return;
  overrides = {};
  localStorage.removeItem(STORE);
  mergeDecisions();
  document.querySelectorAll('.card').forEach(applyCard);
  updateCounts();
  applyFilter();
};

fetchFirst(DATA_URLS)
  .then(({ json }) => start(json))
  .catch(err => {
    document.getElementById('subtitle').textContent = 'Data could not be loaded';
    document.querySelector('main').innerHTML =
      '<div class="status error"><strong>Could not load the errata data.</strong><br>' +
      'Tried:<br><code>' + (err.tried || []).map(esc).join('<br>') + '</code></div>';
  });
})();
</script>
</body></html>
